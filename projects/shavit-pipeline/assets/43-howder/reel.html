<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>43 Howder, Reel Preview (vertical)</title>
<style>
  :root{--gold:#FFC000;--line:#2a2a2e;--dim:#a5a29a;--mono:ui-monospace,"SF Mono",Menlo,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:#000;color:#f4f2ec;font-family:"Inter",system-ui,sans-serif;overflow:hidden}
  /* vertical stage: full viewport height, 9:16 width, centered like a phone */
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .phone{position:relative;height:100dvh;aspect-ratio:9/16;max-width:100vw;background:#000;overflow:hidden}
  .phone video{width:100%;height:100%;object-fit:cover;display:block}
  /* IG safe-zone overlay */
  .safe{position:absolute;inset:0;pointer-events:none;display:none}
  .safe.on{display:block}
  .safe .top{position:absolute;top:0;left:0;right:0;height:14%;background:rgba(224,121,74,.18);border-bottom:1px dashed rgba(224,121,74,.7)}
  .safe .bot{position:absolute;bottom:0;left:0;right:0;height:20%;background:rgba(224,121,74,.18);border-top:1px dashed rgba(224,121,74,.7)}
  .safe .lab{position:absolute;left:8px;font:600 10px/1 var(--mono);color:#e0794a;letter-spacing:.08em}
  /* chrome */
  .bar{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10;flex-wrap:wrap;justify-content:center}
  .btn{all:unset;cursor:pointer;font:600 12px/1 var(--mono);color:#0b0b0c;background:var(--gold);border-radius:999px;padding:8px 14px}
  .btn.ghost{background:rgba(20,20,22,.85);color:var(--dim);border:1px solid var(--line)}
  .btn.ghost.active{color:var(--gold);border-color:var(--gold)}
  .hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font:11px/1.4 var(--mono);color:#6f6c64;z-index:10;text-align:center}
  .title{position:fixed;top:14px;left:14px;font:600 12px/1 var(--mono);color:var(--dim);z-index:10}
</style>
</head>
<body>
<div class="stage"><div class="phone">
  <video id="v" src="" playsinline loop></video>
  <div class="safe" id="safe">
    <div class="top"><span class="lab" style="bottom:6px">IG UI zone</span></div>
    <div class="bot"><span class="lab" style="top:6px">IG UI / caption zone</span></div>
  </div>
</div></div>
<div class="title" id="title">43 HOWDER</div>
<div class="bar" id="bar">
  <button class="btn ghost" id="safebtn">safe zones</button>
  <button class="btn" id="fsbtn">⛶ fullscreen</button>
</div>
<div class="hint">←/→ switch clips · space play/pause · <b>pause → N or the note button = drop a note at that second</b></div>
<div class="notes" id="notesrail">
  <header><b>Video notes</b><span class="cnt" id="notecnt"></span></header>
  <div class="body" id="noteslist"></div>
</div>
<style>
  .notebtn{position:fixed;bottom:60px;right:22px;z-index:12;font:700 13px/1 Inter,sans-serif;color:#0b0b0c;
    background:var(--gold);border:none;border-radius:999px;padding:12px 16px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .composer{position:fixed;left:50%;bottom:250px;transform:translateX(-50%);z-index:20;width:min(480px,92vw);
    background:#141416;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:12px;display:none}
  .composer.on{display:block}
  .composer .at{font:600 11px/1 var(--mono);color:var(--gold);margin-bottom:6px}
  .composer textarea{width:100%;min-height:64px;resize:vertical;background:#000;color:#f4f2ec;border:1px solid var(--line);
    border-radius:6px;padding:8px;font:14px/1.45 Inter,system-ui,sans-serif;box-sizing:border-box}
  .composer .row{display:flex;gap:10px;margin-top:8px;align-items:center}
  .composer .save{all:unset;cursor:pointer;font:600 12px/1 var(--mono);color:#0b0b0c;background:var(--gold);border-radius:6px;padding:7px 12px}
  .composer .cancel{all:unset;cursor:pointer;color:#6f6c64;font-size:12px}
  .notes{position:fixed;top:0;right:0;height:100vh;width:300px;max-width:85vw;background:#141416;border-left:1px solid var(--line);
    transform:translateX(100%);transition:transform .18s ease;z-index:15;display:flex;flex-direction:column}
  .notes.open{transform:none}
  .notes header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
  .notes header b{font:700 12px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#B08D57}
  .notes .cnt{font:600 11px/1 var(--mono);color:var(--gold)}
  .notes .body{overflow:auto;padding:10px;flex:1}
  .notes .item{border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:8px;cursor:pointer}
  .notes .item:hover{border-color:#B08D57}
  .notes .item .k{font:600 11px/1 var(--mono);color:var(--gold)}
  .notes .item .c{font:12.5px/1.45 Inter,sans-serif;color:#f4f2ec;margin-top:4px}
  .marks{position:absolute;left:0;right:0;bottom:6px;height:6px;pointer-events:none}
  .marks i{position:absolute;top:0;width:3px;height:6px;background:var(--gold);border-radius:1px}
</style>
<button class="notebtn" id="notebtn">📝 note @ 0:00</button>

<!-- frame-accurate scrubber -->
<style>
  .scrub{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;z-index:14;width:min(560px,94vw);
    background:rgba(15,15,16,.92);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(8px)}
  .scrub .row1{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .sbtn{all:unset;cursor:pointer;font:700 13px/1 var(--mono);color:#f4f2ec;background:#1b1b1e;border:1px solid var(--line);
    border-radius:7px;padding:7px 11px;user-select:none}
  .sbtn:hover{border-color:var(--gold);color:var(--gold)}
  .sbtn.play{background:var(--gold);color:#0b0b0c;border-color:var(--gold)}
  .tc{font:600 12px/1 var(--mono);color:var(--gold);margin-left:auto;white-space:nowrap}
  .tc .f{color:var(--dim)}
  .scrub input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:#2a2a2e;outline:none;margin:2px 0 8px}
  .scrub input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--gold);border:2px solid #0b0b0c;box-shadow:0 0 0 1px var(--gold);cursor:pointer}
  .strip{display:flex;gap:3px;overflow-x:auto;scrollbar-width:thin}
  .strip canvas{height:56px;border-radius:5px;border:1px solid var(--line);cursor:pointer;flex:0 0 auto}
  .strip canvas:hover{border-color:var(--gold)}
  .strip canvas.cur{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
</style>
<div class="scrub" id="scrub">
  <div class="row1">
    <button class="sbtn play" id="playbtn">▶</button>
    <button class="sbtn" id="fprev" title="1 frame back (,)">‹ fr</button>
    <button class="sbtn" id="fnext" title="1 frame forward (.)">fr ›</button>
    <button class="sbtn" id="s5b" title="0.5s back">−.5s</button>
    <button class="sbtn" id="s5f" title="0.5s forward">+.5s</button>
    <span class="tc" id="tc">0:00.00 <span class="f">f0</span></span>
  </div>
  <input type="range" id="seek" min="0" max="1000" value="0" step="1">
  <div class="strip" id="strip"></div>
</div>
<div class="composer" id="composer">
  <div class="at" id="composerAt"></div>
  <textarea id="composerText" placeholder="What should change at this moment…"></textarea>
  <div class="row">
    <button class="save" id="composerSave">Save note</button>
    <button class="cancel" id="composerCancel">cancel</button>
    <span class="cancel" style="margin-left:auto">⌘/Ctrl+Enter</span>
  </div>
</div>
<script>
const CANDIDATES=["howder_v18","howder_v17","howder_v16","howder_v15","sink_beat","howder_v14","sink_pan","howder_v13","stairs_beat","howder_v12","bathroom_wide","howder_v11","bathroom_pan","kitchen_pan2","howder_v10","transition_be5","howder_v8","transition_be4","howder_v7","transition_be3","howder_v6","transition_be2","howder_v5","transition_be","howder_v4","howder_v3","howder_v2","howder_v1","A1_drone_full_rev","A1_drone_rev","A1_drone_test","animatic_v4","animatic_v3","S4_timelapse_v2","S4_timelapse_raw","animatic_v2","animatic_v1","preview_editorial","preview_photoreel","preview_tour_v4","V_entry2","V_kitchen_still","preview_tour_v3","V_hall2","V_end","preview_tour_v2","V_entry","V_kitchen2","V_kitchen","V_laundry","V_bath","preview_tour","W1","W2","W3","W4","W5","W6","W7","preview_S1_S2","T_ext","T12","S1","S2","S3","S4","S5","S6","S7","S8","S9","S10","S11","S12","S13"];
const avail=[];
const v=document.getElementById("v"), bar=document.getElementById("bar"), title=document.getElementById("title");
let idx=0;
function show(i){
  idx=(i+avail.length)%avail.length;
  v.src=`clips/${avail[idx]}.mp4`; v.play().catch(()=>{});
  title.textContent=`43 HOWDER · ${avail[idx]}`;
  [...bar.querySelectorAll(".clipbtn")].forEach((b,j)=>b.classList.toggle("active",j===idx));
}
Promise.all(CANDIDATES.map(id=>fetch(`clips/${id}.mp4`,{method:"HEAD"}).then(r=>r.ok?id:null).catch(()=>null)))
.then(list=>{
  list.filter(Boolean).forEach(id=>avail.push(id));
  avail.forEach((id,j)=>{
    const b=document.createElement("button"); b.className="btn ghost clipbtn"; b.textContent=id;
    b.onclick=()=>show(j); bar.appendChild(b);
  });
  if(avail.length) show(0);
});
document.getElementById("fsbtn").onclick=()=>{
  const p=document.querySelector(".phone");
  document.fullscreenElement?document.exitFullscreen():p.requestFullscreen();
};
document.getElementById("safebtn").onclick=e=>{
  document.getElementById("safe").classList.toggle("on");
  e.target.classList.toggle("active");
};
addEventListener("keydown",e=>{
  if(e.target.tagName==="TEXTAREA")return;
  if(e.key==="ArrowRight")show(idx+1);
  if(e.key==="ArrowLeft")show(idx-1);
  if(e.key===" "){e.preventDefault(); v.paused?v.play():v.pause();}
  if(e.key==="n"||e.key==="N"){openComposer();}
  if(e.key===","){e.preventDefault(); stepFrame(-1);}
  if(e.key==="."){e.preventDefault(); stepFrame(1);}
});

/* ---------- frame-accurate scrubber + filmstrip ---------- */
const FPS=30, NTHUMB=12;
const seek=document.getElementById("seek"), tcEl=document.getElementById("tc"),
      strip=document.getElementById("strip"), playbtn=document.getElementById("playbtn");
function stepFrame(n){ v.pause(); v.currentTime=Math.max(0,Math.min((v.duration||0)-0.001, v.currentTime+n/FPS)); }
document.getElementById("fprev").onclick=()=>stepFrame(-1);
document.getElementById("fnext").onclick=()=>stepFrame(1);
document.getElementById("s5b").onclick=()=>stepFrame(-15);
document.getElementById("s5f").onclick=()=>stepFrame(15);
playbtn.onclick=()=>{ v.paused?v.play():v.pause(); };
v.addEventListener("play",()=>playbtn.textContent="❚❚");
v.addEventListener("pause",()=>playbtn.textContent="▶");
function fmtTc(t){ const f=Math.round(t*FPS); return `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}.${String(Math.floor((t%1)*100)).padStart(2,"0")} `; }
function syncBar(){
  if(!v.duration) return;
  seek.max=Math.round(v.duration*FPS); seek.value=Math.round(v.currentTime*FPS);
  tcEl.innerHTML=fmtTc(v.currentTime)+`<span class="f">f${Math.round(v.currentTime*FPS)}</span>`;
  const th=[...strip.children]; const i=Math.min(th.length-1, Math.floor(v.currentTime/v.duration*th.length));
  th.forEach((c,j)=>c.classList.toggle("cur",j===i));
}
v.addEventListener("timeupdate",syncBar);
setInterval(()=>{ if(!v.paused) syncBar(); },100);
seek.addEventListener("input",()=>{ v.pause(); v.currentTime=seek.value/FPS; syncBar(); });

let stripToken=0;
async function buildStrip(){
  const tok=++stripToken;
  strip.innerHTML="";
  const src=v.src; if(!src) return;
  const hv=document.createElement("video"); hv.src=src; hv.muted=true; hv.preload="auto"; hv.playsInline=true;
  await new Promise(res=>{ hv.onloadedmetadata=res; hv.onerror=res; });
  if(tok!==stripToken || !hv.duration) return;
  const w=Math.round(56*hv.videoWidth/hv.videoHeight)||32;
  const cells=[];
  for(let i=0;i<NTHUMB;i++){
    const c=document.createElement("canvas"); c.width=w*2; c.height=112;
    const t=(i+0.5)/NTHUMB*hv.duration;
    c.title=fmtTc(t); c.onclick=()=>{ v.pause(); v.currentTime=t; syncBar(); };
    strip.appendChild(c); cells.push([c,t]);
  }
  for(const [c,t] of cells){
    if(tok!==stripToken) return;
    hv.currentTime=t;
    await new Promise(res=>{ hv.onseeked=res; setTimeout(res,600); });
    try{ c.getContext("2d").drawImage(hv,0,0,c.width,c.height); }catch(e){}
  }
}
const _origShow=show;
show=function(i){ _origShow(i); buildStrip(); };
v.addEventListener("loadedmetadata",syncBar);

/* ---------- video annotation (pause -> note at timestamp) ---------- */
const SPEC="43-howder-video";
const LSK="shavit-vannot:"+SPEC;
let vnotes=[]; let usingServer=location.protocol.startsWith("http");
const fmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`;
const notebtn=document.getElementById("notebtn"), composer=document.getElementById("composer"),
      cAt=document.getElementById("composerAt"), cText=document.getElementById("composerText"),
      rail=document.getElementById("notesrail"), list=document.getElementById("noteslist"), cnt=document.getElementById("notecnt");
v.addEventListener("timeupdate",()=>{notebtn.textContent=`📝 note @ ${fmt(v.currentTime)}`;});
function openComposer(){
  v.pause();
  cAt.textContent=`${avail[idx]} @ ${fmt(v.currentTime)} (${v.currentTime.toFixed(1)}s)`;
  composer.classList.add("on"); cText.value=""; cText.focus();
}
async function saveNote(){
  const txt=cText.value.trim(); if(!txt){composer.classList.remove("on");return;}
  const key=`${avail[idx]}@${v.currentTime.toFixed(1)}s`;
  const note={key,clip:avail[idx],t:v.currentTime,comment:txt,at:new Date().toISOString().slice(0,19)};
  vnotes.push(note);
  if(usingServer){
    try{
      const r=await fetch("/annotate",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({section:SPEC+"/"+key,comment:txt})});
      if(!r.ok)throw 0;
    }catch(e){usingServer=false;localStorage.setItem(LSK,JSON.stringify(vnotes));}
  } else localStorage.setItem(LSK,JSON.stringify(vnotes));
  composer.classList.remove("on"); renderNotes();
}
async function loadNotes(){
  if(usingServer){
    try{
      const r=await fetch("/annotations",{cache:"no-store"}); const all=await r.json();
      vnotes=all.filter(e=>(e.section||"").startsWith(SPEC+"/")).map(e=>{
        const key=e.section.slice(SPEC.length+1);
        const m=key.match(/^(.+)@([\d.]+)s$/);
        return {key,clip:m?m[1]:key,t:m?parseFloat(m[2]):0,comment:e.comment,at:e.at};
      });
    }catch(e){usingServer=false;vnotes=JSON.parse(localStorage.getItem(LSK)||"[]");}
  } else vnotes=JSON.parse(localStorage.getItem(LSK)||"[]");
  renderNotes();
}
function renderNotes(){
  cnt.textContent=vnotes.length?`(${vnotes.length})`:"";
  rail.classList.toggle("open",vnotes.length>0);
  list.innerHTML="";
  vnotes.slice().sort((a,b)=>a.clip.localeCompare(b.clip,undefined,{numeric:true})||a.t-b.t).forEach(n=>{
    const it=document.createElement("div"); it.className="item";
    const k=document.createElement("div"); k.className="k"; k.textContent=`${n.clip} @ ${fmt(n.t)}`;
    const c=document.createElement("div"); c.className="c"; c.textContent=n.comment;
    it.appendChild(k); it.appendChild(c);
    it.onclick=()=>{const j=avail.indexOf(n.clip); if(j>=0){show(j); setTimeout(()=>{v.currentTime=n.t; v.pause();},350);}};
    list.appendChild(it);
  });
  renderMarks();
}
function renderMarks(){
  let m=document.querySelector(".marks");
  if(!m){m=document.createElement("div");m.className="marks";document.querySelector(".phone").appendChild(m);}
  m.innerHTML="";
  if(!v.duration)return;
  vnotes.filter(n=>n.clip===avail[idx]).forEach(n=>{
    const i=document.createElement("i"); i.style.left=(n.t/v.duration*100)+"%"; m.appendChild(i);
  });
}
v.addEventListener("loadedmetadata",renderMarks);
notebtn.onclick=openComposer;
document.getElementById("composerSave").onclick=saveNote;
document.getElementById("composerCancel").onclick=()=>composer.classList.remove("on");
cText.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==="Enter")saveNote();
  if(e.key==="Escape")composer.classList.remove("on");
});
loadNotes();
</script>
</body>
</html>
