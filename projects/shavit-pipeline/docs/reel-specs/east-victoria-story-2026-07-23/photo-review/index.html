<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>East Victoria &mdash; Photo Picker</title>
<style>
:root{--bg:#0c0c0e;--card:#151518;--line:#26262b;--brass:#b08d57;--gold:#ffc000;--dim:#8a8a92;--txt:#f2f1ee}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,SFProDisplay,Inter,sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
header b{letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--gold)}
.count{margin-left:auto;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--line)}.bar>div{height:100%;background:var(--brass);transition:width .2s}
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:14px;min-height:0}
.card{position:relative;max-width:100%;max-height:100%;border-radius:16px;overflow:hidden;box-shadow:0 12px 40px #000a;background:#000}
.card img{display:block;max-width:100%;max-height:72vh;object-fit:contain}
.tag{position:absolute;top:12px;left:12px;background:#000a;backdrop-filter:blur(6px);padding:5px 10px;border-radius:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.assigned{position:absolute;top:12px;right:12px;padding:5px 10px;border-radius:8px;font-size:12px;font-weight:600}
.buckets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px}
.buckets.done{display:none}
button.bk{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:12px;padding:12px 8px;font-size:13px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.12s;line-height:1.15}
button.bk:hover{border-color:var(--brass);transform:translateY(-1px)}
button.bk.skip{grid-column:span 3;background:#1a1416;border-color:#3a2226;color:#e59}
.k{display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;background:#000;border:1px solid var(--line);border-radius:4px;font-size:10px;color:var(--dim);margin-right:2px}
footer{display:flex;gap:10px;padding:10px 16px 16px;border-top:1px solid var(--line)}
footer button{flex:1;appearance:none;border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:10px;padding:10px;font-size:13px;cursor:pointer}
footer button:hover{color:var(--txt);border-color:var(--brass)}
#review{display:none;flex:1;overflow:auto;padding:8px 16px 24px}
#review.on{display:block}
#review h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px;display:flex}
#review h2 span{margin-left:auto;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.grid figure{margin:0;position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.grid img{width:100%;height:120px;object-fit:cover;display:block}
.grid figcaption{position:absolute;bottom:0;left:0;right:0;background:#000a;font-size:10px;padding:3px 5px;color:var(--dim)}
.expbar{position:sticky;top:0;background:var(--bg);padding:10px 0;display:flex;gap:10px;z-index:5}
.expbar button{appearance:none;border:1px solid var(--brass);background:var(--brass);color:#111;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.expbar button.ghost{background:transparent;color:var(--brass)}
.empty{color:var(--dim);text-align:center;padding:40px}
</style></head><body><div id=app>
<header><b>East Victoria &middot; Photo Picker</b><span class=count id=count></span></header>
<div class=bar><div id=prog></div></div>
<div class=stage id=stage></div>
<div class=buckets id=buckets></div>
<footer><button id=undo>&larr; Undo</button><button id=finish>Review picks &rarr;</button></footer>
<div id=review></div>
</div>

const BUCKETS=[
 {k:'cover',label:'⭐ Cover',hint:'1',c:'#ffc000'},
 {k:'ext_after',label:'Exterior AFTER',hint:'2',c:'#5fb27a'},
 {k:'ext_before',label:'Exterior BEFORE',hint:'3',c:'#9a8'},
 {k:'kitchen',label:'Kitchen',hint:'4',c:'#6cf'},
 {k:'bath',label:'Bathroom',hint:'5',c:'#6cf'},
 {k:'living',label:'Living / Bed',hint:'6',c:'#6cf'},
 {k:'mech',label:'Basement / Mech',hint:'7',c:'#c98'},
 {k:'detail',label:'Detail / Other',hint:'8',c:'#b9a'},
];
const LS='ev_photo_picks_v1';
let picks=JSON.parse(localStorage.getItem(LS)||'{}');
let order=PHOTOS.map(p=>p.id);
let hist=[];
function firstUndone(){for(const id of order){if(picks[id]===undefined)return order.indexOf(id);}return order.length;}
let i=firstUndone();
const stage=document.getElementById('stage');
const bucketsEl=document.getElementById('buckets');
const countEl=document.getElementById('count');
const progEl=document.getElementById('prog');
function render(){
 const done=order.filter(id=>picks[id]!==undefined).length;
 countEl.textContent=done+' / '+PHOTOS.length+' sorted';
 progEl.style.width=(100*done/PHOTOS.length)+'%';
 if(i>=order.length){stage.innerHTML='<div class=empty>All '+PHOTOS.length+' sorted. Tap <b>Review picks</b> below.</div>';bucketsEl.classList.add('done');return;}
 bucketsEl.classList.remove('done');
 const p=PHOTOS[order[i]];
 const prev=picks[p.id];
 const asg=prev?BUCKETS.find(b=>b.k===prev):null;
 stage.innerHTML='<div class=card><img src="'+p.file+'" alt=""><div class=tag>'+p.src+' &middot; '+p.ref.slice(0,22)+'</div>'+
  (asg?'<div class=assigned style="background:'+asg.c+';color:#111">'+asg.label+'</div>':'')+'</div>';
}
function build(){
 bucketsEl.innerHTML='';
 BUCKETS.forEach(b=>{
  const el=document.createElement('button');el.className='bk';
  el.innerHTML='<span><span class=k>'+b.hint+'</span></span>'+b.label;
  el.onclick=()=>choose(b.k);bucketsEl.appendChild(el);
 });
 const sk=document.createElement('button');sk.className='bk skip';
 sk.innerHTML='<span><span class=k>0</span></span>✕ Skip this photo';
 sk.onclick=()=>choose('skip');bucketsEl.appendChild(sk);
}
function choose(k){if(i>=order.length)return;const id=order[i];hist.push(i);picks[id]=k;save();i++;render();}
function undo(){if(!hist.length){if(i>0)i--;}else{i=hist.pop();}const id=order[i];delete picks[id];save();render();}
function save(){localStorage.setItem(LS,JSON.stringify(picks));}
document.getElementById('undo').onclick=undo;
document.addEventListener('keydown',e=>{
 if(document.getElementById('review').classList.contains('on'))return;
 if(e.key==='Backspace'){e.preventDefault();undo();return;}
 if(e.key==='ArrowLeft'){choose('skip');return;}
 if(e.key==='0'){choose('skip');return;}
 const n=parseInt(e.key);
 if(n>=1&&n<=BUCKETS.length){choose(BUCKETS[n-1].k);}
});
let sx=0;stage.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(dx<-60)choose('skip');});
const review=document.getElementById('review');
document.getElementById('finish').onclick=showReview;
function showReview(){
 review.classList.add('on');
 let html='<div class=expbar><button id=exp>&#10697; Copy picks for Claude</button><button class=ghost id=dl>selections.json</button><button class=ghost id=back>&larr; Keep sorting</button></div>';
 const byBucket={};BUCKETS.forEach(b=>byBucket[b.k]=[]);
 order.forEach(id=>{const k=picks[id];if(k&&k!=='skip'&&byBucket[k])byBucket[k].push(PHOTOS[id]);});
 BUCKETS.forEach(b=>{
  const list=byBucket[b.k];
  html+='<h2>'+b.label+'<span>'+list.length+'</span></h2>';
  if(!list.length){html+='<div class=empty style="padding:14px">none</div>';}
  else{html+='<div class=grid>'+list.map(p=>'<figure><img src="'+p.file+'"><figcaption>'+p.ref.slice(0,18)+'</figcaption></figure>').join('')+'</div>';}
 });
 review.innerHTML=html;
 document.getElementById('back').onclick=()=>{review.classList.remove('on');};
 document.getElementById('exp').onclick=()=>{
  let out='EAST VICTORIA - PHOTO PICKS\n';
  BUCKETS.forEach(b=>{const list=byBucket[b.k];if(list.length){out+='\n['+b.label+']\n'+list.map(p=>'  '+p.src+'/'+p.ref).join('\n')+'\n';}});
  navigator.clipboard.writeText(out).then(()=>{document.getElementById('exp').textContent='Copied - paste to Claude';});
 };
 document.getElementById('dl').onclick=()=>{
  const sel={};BUCKETS.forEach(b=>{sel[b.k]=byBucket[b.k].map(p=>({ref:p.ref,src:p.src,orig:p.orig}));});
  const blob=new Blob([JSON.stringify(sel,null,1)],{type:'application/json'});
