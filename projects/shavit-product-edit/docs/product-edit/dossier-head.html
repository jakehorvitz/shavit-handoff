<title>Cinematic Edit Dossier</title>
<style>
:root{
  --ground:#F3EFE8; --surface:#FBF9F5; --surface-2:#ECE6DC; --ink:#151311; --body:#3d3a35; --muted:#7a746a;
  --hair:#DDD6CB; --hair-strong:#C9C0B2; --brass:#8f6d00; --brass-soft:#c49a00; --brass-wash:rgba(255,192,0,.13);
  --ok:#2e7d4f; --warn:#b7791f; --bad:#b3362d; --chip:#EAE3D6; --code:#efe9df;
  --font-display:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-body:-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0b0b0a; --surface:#151412; --surface-2:#1e1c19; --ink:#F1ECE3; --body:#c9c2b6; --muted:#8b857b;
  --hair:#2b2925; --hair-strong:#3a3731; --brass:#FFC000; --brass-soft:#FFD24D; --brass-wash:rgba(255,192,0,.10);
  --ok:#5fbf85; --warn:#e0a63a; --bad:#e26b62; --chip:#24221e; --code:#1a1917;}}
:root[data-theme="dark"]{
  --ground:#0b0b0a; --surface:#151412; --surface-2:#1e1c19; --ink:#F1ECE3; --body:#c9c2b6; --muted:#8b857b;
  --hair:#2b2925; --hair-strong:#3a3731; --brass:#FFC000; --brass-soft:#FFD24D; --brass-wash:rgba(255,192,0,.10);
  --ok:#5fbf85; --warn:#e0a63a; --bad:#e26b62; --chip:#24221e; --code:#1a1917;}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--body);font:16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
a{color:var(--brass);text-decoration:none;border-bottom:1px solid transparent}
a:hover,a:focus-visible{border-bottom-color:var(--brass);outline:none}
a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
header.masthead{padding:56px 0 28px;border-bottom:1px solid var(--hair)}
.eyebrow{font:600 12px/1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--brass);display:flex;gap:14px;align-items:center}
.eyebrow::before{content:"";width:28px;height:1px;background:var(--brass)}
h1{font:800 clamp(40px,7vw,84px)/.92 var(--font-display);letter-spacing:-.03em;text-transform:uppercase;color:var(--ink);margin:18px 0 18px;text-wrap:balance}
.lede{max-width:66ch;font-size:18px;color:var(--body);margin:0}
.lede strong{color:var(--ink)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);margin-top:32px}
.strip>div{background:var(--surface);padding:14px 16px}
.strip .k{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.strip .v{font:700 22px/1.1 var(--font-display);color:var(--ink);margin-top:8px;font-variant-numeric:tabular-nums}
.strip .v small{font:500 12px/1 var(--font-body);color:var(--muted);margin-left:6px}
section{padding:56px 0 8px}
h2{font:800 clamp(26px,3.4vw,40px)/1 var(--font-display);letter-spacing:-.02em;text-transform:uppercase;color:var(--ink);margin:0 0 8px}
.h2row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--hair);padding-bottom:14px;margin-bottom:24px}
.h2row p{margin:0;color:var(--muted);max-width:60ch}
h3{font:700 20px/1.2 var(--font-display);color:var(--ink);margin:0 0 6px;letter-spacing:-.01em}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.card{background:var(--surface);border:1px solid var(--hair);padding:20px 20px 18px;display:flex;flex-direction:column;gap:12px}
.card .who{font:600 12px/1.3 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card .who b{color:var(--brass);font-weight:700}
.card p{margin:0}
.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--hair-strong);margin-top:4px}
.rail>div{padding:10px 8px 0 0;font-size:13px;line-height:1.35;color:var(--body);position:relative}
.rail>div::before{content:attr(data-t);display:block;font:700 10px/1 var(--font-mono);letter-spacing:.06em;color:var(--brass);margin-bottom:6px}
.rail>div+div{border-left:1px solid var(--hair);padding-left:10px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:600 11px/1 var(--font-mono);letter-spacing:.02em;padding:6px 8px;background:var(--chip);color:var(--body);border-radius:2px}
.risk{font:700 11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;padding:6px 8px;border-radius:2px;display:inline-flex;align-items:center;gap:6px}
.risk::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.risk.low{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.risk.med{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.risk.high{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:10px;border-top:1px solid var(--hair)}
.src{font:12px/1.4 var(--font-mono);color:var(--muted);word-break:break-all}
.src a{color:var(--muted)}
.src a:hover{color:var(--brass)}
.tablewrap{overflow-x:auto;border:1px solid var(--hair);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:14px}
th{font:600 11px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--hair-strong);background:var(--surface-2);position:sticky;top:0}
td{padding:12px 14px;border-bottom:1px solid var(--hair);vertical-align:top;color:var(--body)}
td:first-child{color:var(--ink);font-weight:600}
td .u{font:12px/1.4 var(--font-mono)}
.callout{background:var(--brass-wash);border-left:3px solid var(--brass);padding:16px 18px;color:var(--ink);margin:0 0 18px}
.callout b{color:var(--brass)}
.dir{display:grid;grid-template-columns:1fr;gap:18px}
.dir .card{padding:24px}
.dir .card.rec{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.dir .badge{font:700 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--brass);align-self:flex-start;padding:6px 8px;border:1px solid var(--brass)}
.two{display:grid;grid-template-columns:110px 1fr;gap:6px 18px;font-size:14px;align-items:baseline}
.two dt{font:600 11px/1.4 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.two dd{margin:0;color:var(--body)}
.qs{counter-reset:q;display:flex;flex-direction:column;gap:14px}
.q{background:var(--surface);border:1px solid var(--hair);padding:18px 20px;display:grid;grid-template-columns:44px 1fr;gap:14px}
.q::before{counter-increment:q;content:"Q" counter(q);font:800 20px/1 var(--font-display);color:var(--brass);padding-top:2px}
.q b{color:var(--ink)}
.q .rec{display:block;margin-top:8px;color:var(--body)}
.q .rec span{font:600 11px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--brass);margin-right:8px}
.sources{columns:2;column-gap:32px;font-size:13px;line-height:1.5}
.sources li{break-inside:avoid;margin:0 0 8px;color:var(--muted)}
.sources a{color:var(--body);font-family:var(--font-mono);font-size:12px}
footer{padding:48px 0 64px;border-top:1px solid var(--hair);margin-top:48px;color:var(--muted);font-size:13px}
@media (max-width:640px){.rail{grid-template-columns:1fr 1fr}.sources{columns:1}.q{grid-template-columns:36px 1fr}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}.card:hover{border-color:var(--hair-strong)}}
</style>
