<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Page not found — Shavit Rootman</title>
  <style>
    :root { --gold:#FFC000; }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{
      background:#000;color:#fff;
      font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;
    }
    .wrap{max-width:560px}
    .eyebrow{color:var(--gold);font-weight:700;letter-spacing:2.25px;text-transform:uppercase;font-size:12px}
    h1{font-weight:700;font-size:clamp(48px,9vw,96px);line-height:.95;letter-spacing:-2px;text-transform:uppercase;margin:16px 0}
    hr{width:96px;height:1px;background:var(--gold);border:0;margin:24px auto}
    p{color:#bbb;font-size:18px;line-height:1.6;margin:0 auto 32px;max-width:420px}
    a{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 24px;background:var(--gold);color:#000;
      font-weight:700;font-size:14px;letter-spacing:1.8px;text-transform:uppercase;text-decoration:none}
    a:hover{background:#FFCE3E}
    .brand{margin-top:48px;color:#8a8a8a;font-size:12px;letter-spacing:2px;text-transform:uppercase}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Error 404</div>
    <h1>Page not found.</h1>
    <hr />
    <p>The page you’re looking for doesn’t exist or has moved.</p>
    <a href="/">Back to Home →</a>
    <div class="brand">Shavit Rootman · Managed by Charger Property Management</div>
  </div>
</body>
</html>
