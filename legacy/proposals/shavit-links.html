<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shavit Rootman</title>
<meta name="description" content="Live with us. Work with us.">
<meta property="og:title" content="Shavit Rootman">
<meta property="og:description" content="Live with us. Work with us.">
<meta property="og:type" content="website">
<!-- TODO: absolute URL to a 1200x630 hero image once the site ships -->
<!-- <meta property="og:image" content="https://REPLACE.com/og.jpg"> -->
<style>
  :root {
    --ink:   #16181a;
    --paper: #f6f4f1;
    --line:  rgba(246,244,241,0.16);
    --muted: rgba(246,244,241,0.55);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 48px 20px;
    background: var(--ink); color: var(--paper);
    font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .mark { font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; font-weight: 500; }
  .tagline { margin-top: 14px; font-size: 15px; color: var(--muted); }
  .rule { width: 28px; height: 1px; margin: 32px auto; background: var(--line); }
  nav { display: flex; flex-direction: column; gap: 12px; }
  a.link {
    display: block; padding: 17px 20px;
    border: 1px solid var(--line);
    border-radius: 2px;
    color: var(--paper); text-decoration: none;
    font-size: 15px; letter-spacing: 0.02em;
    transition: background 160ms ease, border-color 160ms ease;
  }
  a.link:hover, a.link:focus-visible {
    background: rgba(246,244,241,0.06);
    border-color: rgba(246,244,241,0.38);
  }
  a.link:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
  a.link[aria-disabled="true"] {
    pointer-events: none; color: var(--muted); border-style: dashed;
  }
  a.link[aria-disabled="true"]::after {
    content: " — soon"; color: rgba(246,244,241,0.34);
  }
  footer {
    margin-top: 40px; font-size: 11px; letter-spacing: 0.2em;
    text-transform: uppercase; color: rgba(246,244,241,0.3);
  }
  @media (prefers-reduced-motion: reduce) { a.link { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="mark">Shavit&nbsp;Rootman</div>
  <p class="tagline">Live with us. Work with us.</p>
  <div class="rule" role="presentation"></div>
  <nav aria-label="Shavit Rootman links">
    <!-- ORDER IS INTENTIONAL: website, facebook, linkedin, substack -->
    <a class="link" href="#REPLACE_WEBSITE"  aria-disabled="true">Website</a>
    <a class="link" href="#REPLACE_FACEBOOK" aria-disabled="true">Facebook</a>
    <a class="link" href="#REPLACE_LINKEDIN" aria-disabled="true">LinkedIn</a>
    <a class="link" href="#REPLACE_SUBSTACK" aria-disabled="true">Substack</a>
  </nav>
  <footer>Midwest</footer>
</main>
</body>
</html>
