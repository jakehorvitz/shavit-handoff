<head>
  <meta charset="utf-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Manrope:wght@300;400;500;600;700;800&display=swap" />

  <link rel="stylesheet" href="design-system/colors_and_type.css" />

  <!-- ===== Analytics (Google Tag Manager) =====================================
       Self-hosted loaders so the strict CSP (script-src 'self', no inline) stays
       intact. gtm-loader.js boots GTM (set your GTM-XXXXXXX inside that file);
       GA4 is configured INSIDE GTM as a Google Tag. analytics.js fires the funnel
       events (email_click / openings_click / owners_page_view / substack_click /
       youtube_click) into the dataLayer.
       To use GA4 WITHOUT GTM instead: comment out gtm-loader.js below and
       uncomment ga4-loader.js (see that file's header). Never load both.
       Setup walkthrough: shavit/analytics/GTM-GA4-setup-guide.md -->
  <script src="gtm-loader.js"></script>
  <!-- <script src="ga4-loader.js"></script> --> <!-- direct-GA4 alternative; do NOT use alongside GTM -->
  <script src="analytics.js" defer></script>
  <!-- ========================================================================== -->
</head>
<body>
  <div id="root"></div>

  <!-- Self-hosted React (production) + pre-compiled app bundle.
       JSX is transpiled at build time (see build_bundle.js) so the page needs
       NO in-browser Babel and NO eval — enabling a strict script-src 'self' CSP. -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="app.bundle.js"></script>
</body>
</html>
